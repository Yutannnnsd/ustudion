<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work | Studio U Yuta</title>
    <meta name="description" content="Selected works by Studio U Yuta." />
    <link rel="stylesheet" href="assets/styles.css?v=preserve-title-case-v1" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./" aria-label="Studio U Yuta top page">Studio U</a>
    </header>

    <main class="works-page" aria-label="Work">
      <article class="work-entry">
        <div class="work-stage">
          <div class="work-copy">
            <h1>Work</h1>
            <p class="piece-title" data-title-from="image">
              <span class="title-text">Sample 01</span>
            </p>
          </div>

          <figure class="piece-image">
            <img src="assets/images/work/sample-01.png" alt="" />
          </figure>
        </div>
      </article>

      <!--
      作品を追加するときは、画像を assets/images/work/ に入れて、
      下の article をコピーし、画像ファイル名だけ書き換えてください。
      作品タイトルは画像ファイル名から自動で入ります。

      <article class="work-entry">
        <div class="work-stage">
          <div class="work-copy">
            <h2>Work</h2>
            <p class="piece-title" data-title-from="image">
              <span class="title-text">Photo 02</span>
            </p>
          </div>

          <figure class="piece-image">
            <img src="assets/images/work/photo-02.jpg" alt="" />
          </figure>
        </div>
      </article>
      -->
    </main>
    <script src="assets/main.js?v=preserve-title-case-v1"></script>
  </body>
</html>
